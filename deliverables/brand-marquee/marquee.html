<style>
  /* ============================================================
     Brand Lines We Carry &amp; Finish for PNG Teams — Marquee
     Self-contained, SVG-based, retina-crisp, seamless loop.
     ============================================================ */
  :root {
    --accent-sky: #38bdf8;
    --accent-blue: #155eef;
    --accent-gold: #f5a623;
    --accent-crimson: #e11d48;
    --bg-top: #0f172a;
    --bg-mid: #1e293b;
    --text-dim: rgba(255, 255, 255, 0.6);
    --marquee-gap: 80px;
    --logo-height: 56px;
    --loop-duration: 35s;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: "Archivo", "Inter", system-ui, -apple-system, sans-serif;
    background: #06070a;
    -webkit-font-smoothing: antialiased;
  }

  .brand-marquee {
    position: relative;
    overflow: hidden;
    background: linear-gradient(180deg, var(--bg-top) 0%, var(--bg-mid) 50%, var(--bg-top) 100%);
    padding: 52px 0 56px;
  }

  /* Top accent bar — single gradient line, consistent palette */
  .brand-marquee::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg,
      transparent 0%,
      var(--accent-sky) 15%,
      var(--accent-blue) 35%,
      var(--accent-gold) 65%,
      var(--accent-crimson) 85%,
      transparent 100%);
  }

  .brand-marquee__heading {
    margin: 0 0 32px;
    text-align: center;
    font-size: 0.82rem;
    font-weight: 700;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--text-dim);
    line-height: 1.4;
  }

  /* ---- viewport: clips track + applies edge-fade gradient mask ---- */
  .brand-marquee__viewport {
    width: 100%;
    overflow: hidden;
    -webkit-mask-image: linear-gradient(90deg,
      transparent 0%, rgba(0,0,0,0.08) 4%, rgba(0,0,0,0.4) 8%,
      #000 14%, #000 86%,
      rgba(0,0,0,0.4) 92%, rgba(0,0,0,0.08) 96%, transparent 100%);
    mask-image: linear-gradient(90deg,
      transparent 0%, rgba(0,0,0,0.08) 4%, rgba(0,0,0,0.4) 8%,
      #000 14%, #000 86%,
      rgba(0,0,0,0.4) 92%, rgba(0,0,0,0.08) 96%, transparent 100%);
  }

  /* ---- track: doubled set, constant-speed linear loop ---- */
  .brand-marquee__track {
    display: flex;
    align-items: center;
    gap: var(--marquee-gap);
    padding-right: var(--marquee-gap);
    width: max-content;
    animation: marquee-scroll var(--loop-duration) linear infinite;
    will-change: transform;
    transform: translateZ(0);
  }

  .brand-marquee__track:hover {
    animation-play-state: paused;
  }

  @keyframes marquee-scroll {
    from { transform: translateZ(0) translateX(0); }
    to   { transform: translateZ(0) translateX(-50%); }
  }

  /* ---- logo ---- */
  .brand-marquee__logo {
    height: var(--logo-height);
    flex: 0 0 auto;
    opacity: 0.7;
    transition: opacity 0.35s cubic-bezier(0.33, 1, 0.68, 1),
                transform 0.35s cubic-bezier(0.33, 1, 0.68, 1);
    transform: scale(1);
  }

  .brand-marquee__logo:hover {
    opacity: 1;
    transform: scale(1.06);
  }

  /* ---- responsive ---- */
  @media (max-width: 768px) {
    .brand-marquee { --marquee-gap: 56px; --logo-height: 44px; --loop-duration: 28s; padding: 40px 0 44px; }
    .brand-marquee__heading { font-size: 0.7rem; letter-spacing: 0.16em; padding: 0 20px; margin-bottom: 24px; }
  }

  @media (max-width: 480px) {
    .brand-marquee { --marquee-gap: 40px; --logo-height: 36px; --loop-duration: 22s; }
  }

  @media (prefers-reduced-motion: reduce) {
    .brand-marquee__track { animation: none; }
  }
</style>
